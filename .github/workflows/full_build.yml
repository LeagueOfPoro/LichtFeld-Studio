name: Windows Package Publish

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Publish channel
        required: false
        type: choice
        default: nightly
        options:
          - nightly
          - stable
      release_version:
        description: Stable version without leading v, for manual stable publishes
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      CUDNN_ROOT_DIR: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      BUILD_DIR: b

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        shell: pwsh
        run: |
          $cudaPath = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_PATH_V12_8=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDNN_ROOT_DIR=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$cudaPath\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure cuDNN is available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cudaPath = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          $include = Join-Path $cudaPath 'include\cudnn.h'
          $libs = @(Get-ChildItem (Join-Path $cudaPath 'lib\x64') -Filter 'cudnn*.lib' -ErrorAction SilentlyContinue)
          $dlls = @(Get-ChildItem (Join-Path $cudaPath 'bin') -Filter 'cudnn*64_9.dll' -ErrorAction SilentlyContinue)

          if ((Test-Path $include) -and $libs.Count -gt 0 -and $dlls.Count -gt 0) {
            Write-Host 'Using cuDNN already available on the runner.'
            $libs | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            $dlls | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
          } else {
            Write-Host 'Installing cuDNN 9.5.0 for CUDA 12 from NVIDIA redist.'
            $url = 'https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/windows-x86_64/cudnn-windows-x86_64-9.5.0.50_cuda12-archive.zip'
            Invoke-WebRequest $url -OutFile cudnn.zip -Verbose
            Expand-Archive cudnn.zip -DestinationPath cudnn
            $root = Get-ChildItem cudnn -Directory | Select-Object -First 1
            if (-not $root) {
              throw 'Could not find extracted cuDNN archive root.'
            }
            Copy-Item "$($root.FullName)\bin\*" (Join-Path $cudaPath 'bin') -Recurse -Force
            Copy-Item "$($root.FullName)\include\*" (Join-Path $cudaPath 'include') -Recurse -Force
            Copy-Item "$($root.FullName)\lib\x64\*" (Join-Path $cudaPath 'lib\x64') -Recurse -Force
          }

          if (-not (Test-Path $include)) {
            throw "cuDNN header was not found after setup: $include"
          }

          $libs = @(Get-ChildItem (Join-Path $cudaPath 'lib\x64') -Filter 'cudnn*.lib' -ErrorAction SilentlyContinue)
          $dlls = @(Get-ChildItem (Join-Path $cudaPath 'bin') -Filter 'cudnn*64_9.dll' -ErrorAction SilentlyContinue)
          if ($libs.Count -eq 0 -or $dlls.Count -eq 0) {
            throw 'cuDNN 9 library or DLL was not found after setup.'
          }

          "CUDNN_ROOT_DIR=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-2026-03-12
          restore-keys: vcpkg-tool-${{ runner.os }}-

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = $env:BUILD_DIR
          $cmakeArgs = "-B $buildDir -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF"
          $retryablePatterns = @(
            'status code 5\d\d',
            'timed out',
            'timeout',
            'connection reset',
            'failed to connect',
            'temporarily unavailable',
            'tls',
            'ssl'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt/3"
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake $cmakeArgs"

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $configureExitCode = $LASTEXITCODE
            $shouldRetry = $false
            $manifestLog = Join-Path $buildDir 'vcpkg-manifest-install.log'
            if (Test-Path $manifestLog) {
              foreach ($pattern in $retryablePatterns) {
                if (Select-String -Path $manifestLog -Pattern $pattern -Quiet) {
                  $shouldRetry = $true
                  break
                }
              }
            }

            if (-not $shouldRetry -or $attempt -eq 3) {
              exit $configureExitCode
            }

            Write-Warning 'Retryable configure failure detected, cleaning build tree before retry.'
            if (Test-Path $buildDir) {
              Remove-Item -Recurse -Force $buildDir
            }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Dump failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $buildDir = $env:BUILD_DIR
          $paths = @(
            "$buildDir\vcpkg-manifest-install.log",
            "$buildDir\vcpkg_installed\vcpkg\issue_body.md",
            "$buildDir\CMakeFiles\CMakeConfigureLog.yaml",
            "$buildDir\CMakeFiles\CMakeError.log",
            "$buildDir\CMakeFiles\CMakeOutput.log",
            "$buildDir\CMakeCache.txt"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "::group::$path"
              Get-Content $path -Tail 400
              Write-Host '::endgroup::'
            }
          }

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/vcpkg-manifest-install.log
            ${{ env.BUILD_DIR }}/vcpkg_installed/vcpkg/issue_body.md
            ${{ env.BUILD_DIR }}/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Package
        id: package
        shell: pwsh
        env:
          BUILD_CHANNEL: ${{ inputs.release_channel }}
          STABLE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dateStamp = Get-Date -AsUTC -Format 'yyyyMMdd'
          $builtAt = Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ'
          $shortSha = (git rev-parse --short HEAD).Trim()
          $fullSha = (git rev-parse HEAD).Trim()
          $buildChannel = $env:BUILD_CHANNEL

          if ([string]::IsNullOrWhiteSpace($buildChannel)) {
            $buildChannel = 'nightly'
          }

          if ($buildChannel -eq 'stable') {
            $packageVersion = [string]$env:STABLE_VERSION
            $packageVersion = $packageVersion.Trim().TrimStart('v')
            if ([string]::IsNullOrWhiteSpace($packageVersion) -or $packageVersion -notmatch '^[0-9]+(\.[0-9]+){1,2}$') {
              throw 'Stable publishes require STABLE_VERSION like 0.5.3.'
            }
          } elseif ($buildChannel -eq 'nightly') {
            $targetVersionFile = '.github/nightly-target-version.txt'
            if (-not (Test-Path $targetVersionFile)) {
              throw "Missing $targetVersionFile."
            }

            $nightlyTargetVersion = Get-Content $targetVersionFile |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ -and -not $_.StartsWith('#') } |
              Select-Object -First 1

            if ([string]::IsNullOrWhiteSpace($nightlyTargetVersion) -or $nightlyTargetVersion -eq 'SET_ME') {
              throw "Set the target version in $targetVersionFile, for example 0.6 or 0.5.3."
            }
            if ($nightlyTargetVersion -notmatch '^[0-9]+(\.[0-9]+){1,2}$') {
              throw "Invalid nightly target version '$nightlyTargetVersion' in $targetVersionFile."
            }

            $packageVersion = "$nightlyTargetVersion.dev$dateStamp+$shortSha"
          } else {
            throw "Unsupported build channel '$buildChannel'."
          }

          $packageName = "LichtFeld-Studio-windows-v$packageVersion.zip"
          cmake --install $env:BUILD_DIR --prefix dist
          if ($LASTEXITCODE -ne 0) {
            throw "cmake --install failed with exit code $LASTEXITCODE."
          }

          Compress-Archive -Path 'dist\*' -DestinationPath $packageName -Force
          if (-not (Test-Path $packageName)) {
            throw "Package was not created: $packageName"
          }

          "build_channel=$buildChannel" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "full_sha=$fullSha" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT

      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: LichtFeld-Studio-windows-${{ steps.package.outputs.package_version }}
          path: ${{ steps.package.outputs.package_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish summary
        shell: pwsh
        env:
          BUILD_CHANNEL: ${{ steps.package.outputs.build_channel }}
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
          FULL_SHA: ${{ steps.package.outputs.full_sha }}
          BUILT_AT: ${{ steps.package.outputs.built_at }}
        run: |
          $summary = @(
            '### Windows package created'
            ''
            "- Artifact: ``LichtFeld-Studio-windows-$env:PACKAGE_VERSION``"
            "- Archive: ``$env:PACKAGE_NAME``"
            "- Channel: ``$env:BUILD_CHANNEL``"
            "- Commit: ``$env:FULL_SHA``"
            "- Built at: ``$env:BUILT_AT``"
            '- Download it from the Artifacts section of this workflow run.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
